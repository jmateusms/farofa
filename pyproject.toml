[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "farofa"
version = "0.2.0"
description = "Failure And Repair simulation Optimization Framework"
readme = "README.md"
license = "BSD-3-Clause"
requires-python = ">=3.9"
authors = [
    { name = "Mateus Santana", email = "jmateussan@gmail.com" },
]
keywords = ["reliability", "simulation", "monte-carlo", "failure", "repair", "maintenance", "weibull", "grp"]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering",
]
dependencies = [
    "numpy>=1.24",
]

[project.urls]
Homepage = "https://github.com/jmateusms/farofa"

[project.scripts]
farofa = "farofa.cli:main"

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov",
]

[tool.setuptools.packages.find]
include = ["farofa*"]

[tool.setuptools.package-data]
"farofa.gui" = ["static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
