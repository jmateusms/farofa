[build-system]
requires = ["setuptools>=68.0", "setuptools-scm"]
build-backend = "setuptools.build_meta"

[project]
name = "farofa"
version = "0.1.0-dev"
description = "Failure And Repair simulation Optimization Framework"
readme = "README.md"
license = "GPL-3.0-or-later"
requires-python = ">=3.9"
authors = [
    { name = "Joao Mateus" },
]
keywords = ["reliability", "simulation", "monte-carlo", "failure", "repair", "maintenance", "weibull", "grp"]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering",
]
dependencies = [
    "numpy>=1.24",
    "numba>=0.58",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov",
]

[tool.setuptools.packages.find]
include = ["farofa*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
